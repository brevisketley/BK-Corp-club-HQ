name: BK HQ build and worker registry validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build HQ UI
        run: npm run build
      - name: Validate worker registry
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          registry = json.loads(Path("config/integrations.json").read_text(encoding="utf-8"))
          external = json.loads(Path("config/external-workers.json").read_text(encoding="utf-8"))
          assert {w["id"] for w in registry["workers"]} == {"sellbird", "openjarvis"}
          assert {w["id"] for w in external["workers"]} == {"sellbird", "openjarvis"}

          for worker in registry["workers"]:
              assert worker["state"] == "DISABLED"
              assert re.fullmatch(r"[0-9a-f]{40}", worker["pinnedCommit"])
              assert worker["secrets"]["valuesStoredInRepository"] is False

          for worker in external["workers"]:
              assert worker["enabled"] is False
              assert worker["deploymentState"] == "FORKED_NOT_DEPLOYED"
              assert re.fullmatch(r"[0-9a-f]{40}", worker["pinnedCommit"])
              assert worker["healthCheck"] is None
              assert worker["endpoint"] is None

          print("HQ build and external-worker safety invariants passed.")
      - name: Smoke-test live HQ API and owner gate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://bk-corp-club-hq-api.onrender.com/health
          code=$(curl --silent --output /tmp/hq-auth-check.json --write-out '%{http_code}' https://bk-corp-club-hq-api.onrender.com/api/tasks)
          test "$code" = "401"
          echo "HQ API health passed; unauthenticated task access correctly returned HTTP 401."
