name: BK HQ build and worker registry validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build HQ UI
        run: npm run build
      - name: Validate worker registry
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          registry = json.loads(Path("config/integrations.json").read_text(encoding="utf-8"))
          external = json.loads(Path("config/external-workers.json").read_text(encoding="utf-8"))
          assert {w["id"] for w in registry["workers"]} == {"sellbird", "openjarvis"}
          assert {w["id"] for w in external["workers"]} == {"sellbird", "openjarvis"}

          for worker in registry["workers"]:
              assert worker["state"] == "DISABLED"
              assert re.fullmatch(r"[0-9a-f]{40}", worker["pinnedCommit"])
              assert worker["secrets"]["valuesStoredInRepository"] is False

          for worker in external["workers"]:
              assert worker["enabled"] is False
              assert worker["deploymentState"] == "FORKED_NOT_DEPLOYED"
              assert re.fullmatch(r"[0-9a-f]{40}", worker["pinnedCommit"])
              assert worker["healthCheck"] is None
              assert worker["endpoint"] is None

          print("HQ build and external-worker safety invariants passed.")
      - name: Validate installed skill capability map
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path("config/skills.json").read_text(encoding="utf-8"))
          skills = data["skills"]
          departments = data["departments"]
          assert len(skills) == 22
          assert len({s["id"] for s in skills}) == 22
          assert len(departments) == 8
          skill_ids = {s["id"] for s in skills}
          mapped = [skill_id for d in departments for skill_id in d["skillIds"]]
          assert set(mapped) == skill_ids
          assert len(mapped) == len(set(mapped))
          assert all(s["runtimeStatus"] == "repository_installed_not_runtime_connected" for s in skills)
          assert data["runtimeStatus"] == "not_connected"
          closer = next(s for s in skills if s["id"] == "seed-closer")
          assert closer["mode"] == "draft_only_approval_required"
          deploy = next(s for s in skills if s["id"] == "replica-deploy")
          assert deploy["mode"] == "deployment_requires_owner_approval"
          customer_service = next(d for d in departments if d["id"] == "customer-service")
          assert customer_service["gap"]
          print("22 skills, 8 departments, unique role mapping and approval gates validated.")

      - name: Smoke-test Neon Data API owner isolation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          base="https://ep-late-breeze-baqn7tmy.apirest.c-8.eu-central-1.aws.neon.tech/neondb/rest/v1"
          for table in hq_projects hq_departments hq_agents hq_tasks hq_handoffs hq_integrations hq_activity hq_owner_settings hq_workflows hq_workflow_runs hq_workflow_steps; do
            code=$(curl --silent --output /tmp/hq-data-api-check.json --write-out '%{http_code}' "$base/$table?select=*")
            if [ "$code" != "401" ] && [ "$code" != "403" ]; then
              echo "Expected unauthenticated access to $table to be denied; received HTTP $code"
              cat /tmp/hq-data-api-check.json
              exit 1
            fi
          done
          echo "All 11 HQ tables reject unauthenticated Data API access."
      - name: Smoke-test deployed HQ frontend and auth routes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          code=$(curl --silent --output /tmp/hq-root.html --write-out '%{http_code}' --retry 6 --retry-delay 5 --retry-all-errors https://bk-corp-club-hq.onrender.com/)
          test "$code" = "200"
          grep -qi "BK Corp Club HQ" /tmp/hq-root.html
          for path in /auth/sign-in /auth/forgot-password /auth/reset-password; do
            code=$(curl --silent --output /tmp/hq-auth.html --write-out '%{http_code}' --retry 6 --retry-delay 5 --retry-all-errors "https://bk-corp-club-hq.onrender.com$path")
            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "Unexpected HTTP $code for $path"
              cat /tmp/hq-auth.html
              exit 1
            fi
            grep -qi "BK Corp Club HQ" /tmp/hq-auth.html
          done
          asset=$(grep -oE 'src="[^"]+\.js"' /tmp/hq-auth.html | head -1 | cut -d '"' -f2)
          test -n "$asset"
          curl --fail --silent --show-error "https://bk-corp-club-hq.onrender.com$asset" -o /tmp/hq-app.js
          grep -q "apirest.c-8.eu-central-1.aws.neon.tech" /tmp/hq-app.js
          echo "HQ root, auth/reset routes and compiled Neon Data API configuration are live."
