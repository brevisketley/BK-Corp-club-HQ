name: BK HQ build and worker registry validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build HQ UI
        run: npm run build
      - name: Validate worker registry
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          registry = json.loads(Path("config/integrations.json").read_text(encoding="utf-8"))
          external = json.loads(Path("config/external-workers.json").read_text(encoding="utf-8"))
          assert {w["id"] for w in registry["workers"]} == {"sellbird", "openjarvis"}
          assert {w["id"] for w in external["workers"]} == {"sellbird", "openjarvis"}

          for worker in registry["workers"]:
              assert worker["state"] == "DISABLED"
              assert re.fullmatch(r"[0-9a-f]{40}", worker["pinnedCommit"])
              assert worker["secrets"]["valuesStoredInRepository"] is False

          for worker in external["workers"]:
              assert worker["enabled"] is False
              assert worker["deploymentState"] == "FORKED_NOT_DEPLOYED"
              assert re.fullmatch(r"[0-9a-f]{40}", worker["pinnedCommit"])
              assert worker["healthCheck"] is None
              assert worker["endpoint"] is None

          print("HQ build and external-worker safety invariants passed.")
      - name: Smoke-test Neon Data API owner isolation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          url="https://ep-late-breeze-baqn7tmy.apirest.c-8.eu-central-1.aws.neon.tech/neondb/rest/v1/hq_tasks?select=id"
          code=$(curl --silent --output /tmp/hq-data-api-check.json --write-out '%{http_code}' "$url")
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            cat /tmp/hq-data-api-check.json
            echo "Expected unauthenticated Data API request to be denied; received HTTP $code"
            exit 1
          fi
          echo "Neon Data API rejects unauthenticated requests (HTTP $code). Owner-specific RLS is enforced in PostgreSQL."
      - name: Smoke-test deployed HQ frontend and auth routes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          code=$(curl --silent --output /tmp/hq-root.html --write-out '%{http_code}' --retry 6 --retry-delay 5 --retry-all-errors https://bk-corp-club-hq.onrender.com/)
          test "$code" = "200"
          grep -qi "BK Corp Club HQ" /tmp/hq-root.html
          for path in /auth/sign-in /auth/forgot-password /auth/reset-password; do
            code=$(curl --silent --output /tmp/hq-auth.html --write-out '%{http_code}' --retry 6 --retry-delay 5 --retry-all-errors "https://bk-corp-club-hq.onrender.com$path")
            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "Unexpected HTTP $code for $path"
              cat /tmp/hq-auth.html
              exit 1
            fi
            grep -qi "BK Corp Club HQ" /tmp/hq-auth.html
          done
          echo "HQ root and SPA auth/reset routes serve the compiled application."
